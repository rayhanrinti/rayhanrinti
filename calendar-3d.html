<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Calendar — Thursday &amp; Friday</title>
  <style>
    @property --lift {
      syntax: '<length>';
      inherits: true;
      initial-value: 0px;
    }

    :root {
      --bg: #1a1a1a;
      --bg-deep: #0f0f0f;
      --tile: #2a2a2a;
      --tile-side: #1f1f1f;
      --tile-side-dark: #161616;
      --text: #f0f0f0;
      --muted: #8a8a8a;
      --accent: #ff6b35;
      --accent-2: #ff8c42;
      --accent-side: #c94a1c;
      --accent-side-dark: #9c3612;
      --cell: clamp(34px, 9vw, 70px);
      --gap: clamp(4px, 1.2vw, 10px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(ellipse at 50% 60%, rgba(255, 107, 53, 0.10), transparent 60%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2.5rem 16px 0;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: clamp(28px, 6vw, 48px);
      line-height: 1.15;
      font-weight: 700;
    }

    h1 .hl {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.25rem;
    }

    .controls button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }

    .controls button:hover { background: var(--accent); color: #fff; transform: translateY(-2px); }

    .month-label {
      min-width: 10ch;
      font-size: 18px;
      font-weight: 600;
    }

    /* ---------- 3D stage ---------- */
    .scene {
      perspective: 1400px;
      perspective-origin: 50% 30%;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: clamp(40px, 8vw, 90px) 16px clamp(60px, 10vw, 120px);
    }

    .board {
      transform-style: preserve-3d;
      transform: rotateX(56deg) rotateZ(-28deg);
      animation: sway 9s ease-in-out infinite alternate;
      position: relative;
    }

    @keyframes sway {
      from { transform: rotateX(56deg) rotateZ(-32deg); }
      to   { transform: rotateX(52deg) rotateZ(-18deg); }
    }

    /* base slab under the calendar */
    .slab {
      position: absolute;
      inset: calc(var(--gap) * -2.5);
      background: linear-gradient(135deg, #222, #141414);
      border-radius: 10px;
      transform: translateZ(-1px);
      box-shadow: 0 0 80px rgba(255, 107, 53, 0.18);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, var(--cell));
      gap: var(--gap);
      transform-style: preserve-3d;
      position: relative;
    }

    /* Each tile is a little box: top face = element, sides = pseudo-elements */
    .tile {
      --lift: 6px;
      position: relative;
      width: var(--cell);
      height: var(--cell);
      background: var(--tile);
      border-radius: 4px;
      transform-style: preserve-3d;
      transform: translateZ(var(--lift));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: clamp(11px, 2.6vw, 18px);
      color: var(--text);
      animation: drop 0.7s cubic-bezier(.2, .9, .3, 1.3) backwards;
      animation-delay: calc(var(--i) * 22ms);
      transition: --lift 0.6s cubic-bezier(.2, .9, .3, 1.4), background 0.4s, box-shadow 0.4s;
    }

    .tile::before,
    .tile::after {
      content: '';
      position: absolute;
      background: var(--tile-side);
      transition: background 0.4s;
    }

    /* front face — hangs from the bottom edge down to the floor */
    .tile::before {
      left: 0;
      top: 100%;
      width: 100%;
      height: var(--lift);
      transform-origin: top;
      transform: rotateX(-90deg);
    }

    /* left face (the board is turned so the left side faces the viewer) */
    .tile::after {
      top: 0;
      right: 100%;
      width: var(--lift);
      height: 100%;
      transform-origin: right;
      transform: rotateY(-90deg);
      background: var(--tile-side-dark);
    }

    @keyframes drop {
      0%   { transform: translateZ(260px) rotateX(-90deg); }
      100% { transform: translateZ(var(--lift)); }
    }

    .tile.empty { background: transparent; }
    .tile.empty::before, .tile.empty::after { display: none; }

    .tile.head {
      background: #333;
      font-size: clamp(9px, 2vw, 13px);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ---------- Thursday & Friday highlight ---------- */
    .tile.hot {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }
    .tile.hot::before { background: var(--accent-side); }
    .tile.hot::after  { background: var(--accent-side-dark); }

    .board.raised .tile.hot {
      --lift: calc(var(--cell) * 0.55);
      box-shadow: 0 0 24px rgba(255, 140, 66, 0.55);
      animation:
        drop 0.7s cubic-bezier(.2, .9, .3, 1.3) backwards,
        pulse 2.4s ease-in-out infinite;
      animation-delay: calc(var(--i) * 22ms), calc(var(--col) * 0.25s + var(--row) * 0.12s);
    }

    .board.raised .tile.hot.head { --lift: calc(var(--cell) * 0.75); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 16px rgba(255, 140, 66, 0.35); }
      50%      { box-shadow: 0 0 34px rgba(255, 140, 66, 0.85); }
    }

    .tile.today {
      outline: 2px solid #fff;
      outline-offset: -4px;
    }

    .tile:not(.empty):not(.head):hover {
      --lift: calc(var(--cell) * 0.3);
    }
    .board.raised .tile.hot:hover {
      --lift: calc(var(--cell) * 0.85);
    }

    /* ---------- legend ---------- */
    .legend {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 16px 2.5rem;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 10px 18px;
      border-radius: 999px;
      background: #252525;
      border: 1px solid #333;
      font-size: 14px;
    }

    .chip .dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 10px rgba(255, 107, 53, 0.6);
    }

    .chip strong { color: var(--accent); }

    .toggle {
      cursor: pointer;
      color: var(--text);
      font: inherit;
      transition: border-color 0.2s;
    }
    .toggle:hover { border-color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      .board { animation: none; }
      .tile { animation: none !important; transition: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="eyebrow">Weekly highlight</div>
  <h1><span class="hl">Thursday</span> &amp; <span class="hl">Friday</span></h1>
  <div class="controls">
    <button id="prev" aria-label="Previous month">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="next" aria-label="Next month">›</button>
  </div>
</header>

<main class="scene">
  <div class="board" id="board">
    <div class="slab"></div>
    <div class="grid" id="grid" role="grid" aria-label="Calendar"></div>
  </div>
</main>

<div class="legend">
  <div class="chip"><span class="dot"></span><span><strong id="thuCount">0</strong> Thursdays</span></div>
  <div class="chip"><span class="dot"></span><span><strong id="friCount">0</strong> Fridays</span></div>
  <button class="chip toggle" id="toggle">Lower highlight</button>
</div>

<script>
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const HOT = new Set([4, 5]); // Thursday, Friday

  const grid = document.getElementById('grid');
  const board = document.getElementById('board');
  const label = document.getElementById('monthLabel');
  const toggle = document.getElementById('toggle');

  const now = new Date();
  let view = new Date(now.getFullYear(), now.getMonth(), 1);
  let raiseTimer;

  function tile(text, cls, i, col, row) {
    const el = document.createElement('div');
    el.className = 'tile ' + cls;
    el.textContent = text;
    el.style.setProperty('--i', i);
    el.style.setProperty('--col', col);
    el.style.setProperty('--row', row);
    return el;
  }

  function render() {
    const y = view.getFullYear();
    const m = view.getMonth();
    label.textContent = view.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    grid.replaceChildren();
    board.classList.remove('raised');
    clearTimeout(raiseTimer);

    let i = 0;
    DAYS.forEach((d, col) => {
      const t = tile(d, 'head' + (HOT.has(col) ? ' hot' : ''), i++, col, 0);
      t.setAttribute('role', 'columnheader');
      grid.appendChild(t);
    });

    const first = new Date(y, m, 1).getDay();
    const total = new Date(y, m + 1, 0).getDate();
    let thu = 0, fri = 0;

    for (let k = 0; k < first; k++) grid.appendChild(tile('', 'empty', i++, k, 1));

    for (let d = 1; d <= total; d++) {
      const col = (first + d - 1) % 7;
      const row = Math.floor((first + d - 1) / 7) + 1;
      let cls = HOT.has(col) ? 'hot' : '';
      if (col === 4) thu++;
      if (col === 5) fri++;
      if (y === now.getFullYear() && m === now.getMonth() && d === now.getDate()) cls += ' today';
      const t = tile(d, cls, i++, col, row);
      t.setAttribute('role', 'gridcell');
      t.setAttribute('aria-label', new Date(y, m, d).toDateString() + (HOT.has(col) ? ' (highlighted)' : ''));
      grid.appendChild(t);
    }

    document.getElementById('thuCount').textContent = thu;
    document.getElementById('friCount').textContent = fri;

    // Lift Thursday & Friday once the drop-in has settled
    if (toggle.dataset.off !== '1') {
      raiseTimer = setTimeout(() => board.classList.add('raised'), i * 22 + 500);
    }
  }

  document.getElementById('prev').onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
  document.getElementById('next').onclick = () => { view.setMonth(view.getMonth() + 1); render(); };

  toggle.onclick = () => {
    const off = board.classList.toggle('raised') === false;
    toggle.dataset.off = off ? '1' : '';
    toggle.textContent = off ? 'Raise highlight' : 'Lower highlight';
  };

  render();
</script>

</body>
</html>
