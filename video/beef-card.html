<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Beef Card Animation</title>
<!--
  5-second "জবাই → সরাসরি → আউটলেট / FRESH BEEF → DIRECT SALE" animation.
  Frame-driven like calendar-video.html: render.js calls window.renderFrame(t).
  Designed on a fixed 2000x852 stage and scaled to fit the viewport.
-->
<style>
  @font-face { font-family: 'Hind Siliguri'; font-weight: 700; src: url('fonts/hind-siliguri-bengali-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Roboto'; font-weight: 700; src: url('fonts/roboto-latin-700-normal.woff2') format('woff2'); }
  :root {
    --bg: #000;
    --border: #2b2b2b;
    --icon: #2f9e5c;
    --green: #1fbf4f;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 2000px; height: 852px;
    transform-origin: 0 0;
  }
  svg.frame { position: absolute; inset: 0; overflow: visible; }
  .col {
    position: absolute; top: 120px; width: 600px;
    display: flex; flex-direction: column; align-items: center;
  }
  .icon { width: 132px; height: 132px; overflow: visible; }
  .icon path, .icon circle {
    fill: none; stroke: var(--icon); stroke-width: 2.1;
    stroke-linecap: round; stroke-linejoin: round;
  }
  #i2 path { stroke-width: 1.8; }
  .icon.arrow path { stroke: var(--white); stroke-width: 1.5; }
  .word {
    font-family: 'Hind Siliguri', sans-serif; font-weight: 700;
    font-size: 112px; line-height: 1; color: var(--white);
    text-shadow: 3px 4px 0 rgba(255,255,255,0.18);
    white-space: nowrap;
  }
  .tag {
    position: absolute; left: 0; right: 0; top: 655px;
    text-align: center;
    font-family: 'Roboto', sans-serif; font-weight: 700;
    font-size: 88px; letter-spacing: -0.5px; color: var(--green);
    line-height: 1;
  }
  .tag .arr { display: inline-block; width: 0.95em; height: 0.6em; margin: 0 0.12em; vertical-align: 0.04em; overflow: visible; }
  .tag .arr path { fill: none; stroke: currentColor; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="stage">
  <svg class="frame" viewBox="0 0 2000 852">
    <rect id="card" x="84" y="66" width="1832" height="772" rx="64" fill="none" stroke="var(--border)" stroke-width="4" pathLength="1"/>
    <line id="divider" x1="146" y1="552" x2="1854" y2="552" stroke="#232323" stroke-width="3"/>
  </svg>

  <!-- left: meat -->
  <div class="col" id="c0" style="left:118px">
    <svg class="icon" viewBox="0 0 24 24" id="i0">
      <path pathLength="1" d="M7.2 4.3c3.4-1.9 8.6-1.4 11.3 1.3c2.5 2.5 2.7 6.6 0.4 9.5c-1.8 2.3-4.6 3.4-7.1 4.3c-2.3 .9-4.8 .3-6.4-1.3l-1-1c-1.4-1.4-1.3-3.6 .2-4.8c1.2-1 1.5-2.7 .8-4.1c-.6-1.4 .4-3.1 1.8-3.9z"/>
      <path pathLength="1" d="M3.6 13.6c-.5 1.6 0 3.2 1.4 4.4c1.7 1.5 4.2 2 6.4 1.2c2.6-1 5.4-2.1 7.3-4.4c.8-1 1.3-2 1.6-3.1"/>
      <path pathLength="1" d="M8.1 7.2c1.3-1.2 3.4-1.2 4.6 .1c1.2 1.3 1.1 3.3-.2 4.5"/>
      <path pathLength="1" d="M10.6 9.6l3.6 3.4"/>
    </svg>
    <div class="word" id="w0" style="margin-top:72px">জবাই</div>
  </div>

  <!-- middle: arrow -->
  <div class="col" id="c1" style="left:700px">
    <svg class="icon arrow" viewBox="0 0 24 24" id="i1" style="width:96px;height:96px;margin-top:18px">
      <path pathLength="1" d="M4 12h15"/>
      <path pathLength="1" d="M13 6l6 6l-6 6"/>
    </svg>
    <div class="word" id="w1" style="margin-top:72px">সরাসরি</div>
  </div>

  <!-- right: outlet -->
  <div class="col" id="c2" style="left:1282px">
    <svg class="icon" viewBox="0 0 24 24" id="i2">
      <path pathLength="1" d="M5 9.2V6.6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v2.6"/>
      <path pathLength="1" d="M5 6.6h14"/>
      <path pathLength="1" d="M5 9.2c.8 .9 2 .9 2.8 0c.8 .9 2 .9 2.8 0c.8 .9 2 .9 2.8 0c.8 .9 2 .9 2.8 0c.8 .9 2 .9 2.8 0"/>
      <path pathLength="1" d="M6 11v7.5a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V11"/>
      <path pathLength="1" d="M10.2 20.5v-3.2a1.8 1.8 0 0 1 3.6 0v3.2"/>
    </svg>
    <div class="word" id="w2" style="margin-top:72px">আউটলেট</div>
  </div>

  <div class="tag" id="tag">FRESH BEEF <svg class="arr" id="tagArr" viewBox="0 0 44 24"><path d="M2 12h37M30 3.5l9 8.5l-9 8.5"/></svg> DIRECT SALE</div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const s = Math.min(innerWidth / 2000, innerHeight / 852);
  stage.style.transform = `scale(${s}) translate(-1000px, -426px)`;

  const clamp = x => Math.min(1, Math.max(0, x));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const easeBack = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const $ = id => document.getElementById(id);

  const card = $('card'), divider = $('divider'), tag = $('tag'), tagArr = $('tagArr');
  const icons = [0, 1, 2].map(i => $('i' + i));
  const words = [0, 1, 2].map(i => $('w' + i));

  // draw an icon's strokes one after another inside [a, b]
  function drawIcon(svg, t, a, b) {
    const parts = svg.querySelectorAll('path, circle');
    const n = parts.length, span = (b - a) / n;
    parts.forEach((p, k) => {
      const d = easeInOut(prog(t, a + k * span * 0.7, a + k * span * 0.7 + span * 1.6));
      p.style.strokeDasharray = '1 1';
      p.style.strokeDashoffset = 1 - d;
      p.style.opacity = d > 0 ? 1 : 0;
    });
  }

  window.DURATION = 5;

  window.renderFrame = (t) => {
    // card border traces around, then settles
    const cb = easeInOut(prog(t, 0, 0.9));
    card.style.strokeDasharray = '1 1';
    card.style.strokeDashoffset = 1 - cb;

    // three steps: icon draws, word pops
    const starts = [0.35, 0.95, 1.55];
    starts.forEach((st, i) => {
      drawIcon(icons[i], t, st, st + 0.6);
      const ip = easeBack(prog(t, st, st + 0.45));
      icons[i].style.transform = `translateY(${(1 - ip) * 24}px) scale(${0.7 + 0.3 * ip})`;

      const wp = prog(t, st + 0.25, st + 0.75);
      const we = easeBack(wp);
      words[i].style.opacity = clamp(wp * 2.5);
      words[i].style.transform = `translateY(${(1 - we) * 50}px) scale(${0.75 + 0.25 * we})`;
      words[i].style.filter = `blur(${(1 - clamp(wp * 1.6)) * 8}px)`;
    });

    // middle arrow keeps nudging forward once it's drawn
    const nudge = Math.max(0, Math.sin((t - 1.6) * Math.PI * 1.6)) * prog(t, 1.6, 1.8);
    icons[1].style.transform += ` translateX(${nudge * 14}px)`;

    // icons breathe with a soft green glow at the end
    const glow = prog(t, 3.4, 3.9);
    icons.forEach((ic, i) => {
      if (i === 1) return;
      const pulse = 0.5 + 0.5 * Math.sin((t - 3.4) * 4 - i);
      ic.style.filter = `drop-shadow(0 0 ${glow * (6 + pulse * 10)}px rgba(47,158,92,${glow * 0.8}))`;
    });

    // divider grows from the centre
    const dv = easeInOut(prog(t, 2.25, 2.85));
    divider.setAttribute('x1', 1000 - 854 * dv);
    divider.setAttribute('x2', 1000 + 854 * dv);
    divider.style.opacity = dv > 0 ? 1 : 0;

    // tagline wipes in left to right, then glows
    const tw = easeInOut(prog(t, 2.6, 3.5));
    tag.style.clipPath = `inset(-20% ${(1 - tw) * 100}% -20% 0)`;
    tag.style.transform = `translateY(${(1 - easeOut(prog(t, 2.6, 3.2))) * 20}px)`;
    const tg = prog(t, 3.5, 3.9);
    const tp = 0.5 + 0.5 * Math.sin((t - 3.5) * 3.5);
    tag.style.textShadow = `0 0 ${tg * (10 + tp * 18)}px rgba(31,191,79,${tg * 0.55})`;
    tagArr.style.filter = `drop-shadow(0 0 ${tg * (5 + tp * 9)}px rgba(31,191,79,${tg * 0.55}))`;
    const an = Math.max(0, Math.sin((t - 3.5) * Math.PI * 1.6)) * tg;
    tagArr.style.transform = `translateX(${an * 10}px)`;
  };

  window.renderFrame(0);
})();
</script>
</body>
</html>
