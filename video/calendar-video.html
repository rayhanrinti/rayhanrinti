<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calendar Video Frame</title>
<!--
  Deterministic, frame-by-frame version of calendar-3d.html for video export.
  Nothing animates on its own: render.js calls window.renderFrame(seconds)
  and takes a screenshot. Size comes from the viewport, so the same page
  produces 16:9, 1:1 and 9:16.
  URL params: ?month=2026-11 (defaults to current month)
-->
<style>
  :root {
    --bg: #1a1a1a;
    --tile: #2a2a2a;
    --tile-side: #1f1f1f;
    --tile-side-dark: #161616;
    --text: #f0f0f0;
    --muted: #8a8a8a;
    --accent: #ff6b35;
    --accent-2: #ff8c42;
    --accent-side: #c94a1c;
    --accent-side-dark: #9c3612;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    position: relative;
  }
  #glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 58%, rgba(255,107,53,0.16), transparent 62%);
  }
  .title-wrap {
    position: absolute; left: 0; right: 0;
    text-align: center;
  }
  .eyebrow { letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  h1 { font-weight: 800; line-height: 1.1; }
  .hl {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .month { font-weight: 600; color: var(--text); opacity: 0.9; }

  .scene {
    position: absolute; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center;
    perspective: 1600px;
  }
  .board { position: relative; transform-style: preserve-3d; }
  .slab {
    position: absolute;
    background: linear-gradient(135deg, #232323, #131313);
    border-radius: 12px;
    transform: translateZ(-1px);
  }
  .grid { display: grid; transform-style: preserve-3d; position: relative; }
  .tile {
    position: relative;
    background: var(--tile);
    border-radius: 5px;
    transform-style: preserve-3d;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--text);
  }
  .tile::before, .tile::after { content: ''; position: absolute; background: var(--tile-side); }
  .tile::before {
    left: 0; top: 100%; width: 100%; height: var(--lift);
    transform-origin: top; transform: rotateX(-90deg);
  }
  .tile::after {
    top: 0; right: 100%; width: var(--lift); height: 100%;
    transform-origin: right; transform: rotateY(-90deg);
    background: var(--tile-side-dark);
  }
  .tile.head { background: #333; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .tile.empty { background: transparent; }
  .tile.empty::before, .tile.empty::after { display: none; }
  .tile.hot { color: #fff; }
  .tile.hot::before { background: var(--accent-side); }
  .tile.hot::after { background: var(--accent-side-dark); }

  .chips {
    position: absolute; left: 0; right: 0;
    display: flex; justify-content: center; flex-wrap: wrap;
  }
  .chip {
    display: inline-flex; align-items: center;
    border-radius: 999px; background: #252525; border: 2px solid #333;
    font-weight: 500;
  }
  .chip .dot {
    border-radius: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px rgba(255,107,53,0.7);
  }
  .chip strong { color: var(--accent); }
</style>
</head>
<body>
  <div id="glow"></div>
  <div class="title-wrap" id="title">
    <div class="eyebrow" id="eyebrow">Weekly highlight</div>
    <h1 id="h1"><span class="hl">Thursday</span> &amp; <span class="hl">Friday</span></h1>
    <div class="month" id="month"></div>
  </div>
  <div class="scene" id="scene">
    <div class="board" id="board">
      <div class="slab" id="slab"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
  <div class="chips" id="chips">
    <div class="chip" id="chipThu"><span class="dot"></span><span><strong id="thuCount"></strong> Thursdays</span></div>
    <div class="chip" id="chipFri"><span class="dot"></span><span><strong id="friCount"></strong> Fridays</span></div>
  </div>

<script>
(() => {
  const W = innerWidth, H = innerHeight;
  const portrait = H > W * 1.2, landscape = W > H * 1.2;
  const U = Math.min(W, H) / 100;           // 1% of the short side

  // ---------- month ----------
  const param = new URLSearchParams(location.search).get('month');
  const base = param ? new Date(+param.slice(0, 4), +param.slice(5, 7) - 1, 1) : new Date();
  const Y = base.getFullYear(), M = base.getMonth();
  document.getElementById('month').textContent =
    new Date(Y, M, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  // ---------- layout per aspect ratio ----------
  const cell = portrait ? W * 0.09 : landscape ? H * 0.085 : W * 0.088;
  const gap = cell * 0.13;
  const titleTop = portrait ? H * 0.12 : landscape ? H * 0.06 : H * 0.06;
  const sceneTop = portrait ? H * 0.30 : landscape ? H * 0.22 : H * 0.25;
  const sceneH   = portrait ? H * 0.50 : landscape ? H * 0.64 : H * 0.58;
  const chipsTop = portrait ? H * 0.82 : landscape ? H * 0.87 : H * 0.86;
  const baseRotZ = portrait ? -24 : -28;

  const title = document.getElementById('title');
  title.style.top = titleTop + 'px';
  document.getElementById('eyebrow').style.fontSize = (portrait ? 3.2 : 2.4) * U + 'px';
  document.getElementById('eyebrow').style.marginBottom = 1.2 * U + 'px';
  document.getElementById('h1').style.fontSize = (portrait ? 9.5 : landscape ? 8 : 8.4) * U + 'px';
  const monthEl = document.getElementById('month');
  monthEl.style.fontSize = (portrait ? 4 : 3) * U + 'px';
  monthEl.style.marginTop = 1.4 * U + 'px';

  const scene = document.getElementById('scene');
  scene.style.top = sceneTop + 'px';
  scene.style.height = sceneH + 'px';
  scene.style.perspective = Math.max(W, H) * 1.3 + 'px';

  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(7, ${cell}px)`;
  grid.style.gap = gap + 'px';
  const slab = document.getElementById('slab');
  slab.style.inset = -gap * 2.5 + 'px';

  const chips = document.getElementById('chips');
  chips.style.top = chipsTop + 'px';
  chips.style.gap = 2.4 * U + 'px';
  for (const c of chips.children) {
    c.style.fontSize = (portrait ? 3.6 : 2.8) * U + 'px';
    c.style.padding = `${1.6 * U}px ${3.2 * U}px`;
    c.style.gap = 1.6 * U + 'px';
    const d = c.querySelector('.dot');
    d.style.width = d.style.height = 2.2 * U + 'px';
  }

  // ---------- build tiles ----------
  const HOT = new Set([4, 5]);
  const tiles = [];
  const add = (text, cls, col, row) => {
    const el = document.createElement('div');
    el.className = 'tile ' + cls;
    el.textContent = text;
    el.style.width = el.style.height = cell + 'px';
    el.style.fontSize = (cls.includes('head') ? 0.24 : 0.34) * cell + 'px';
    grid.appendChild(el);
    tiles.push({ el, col, row, hot: HOT.has(col), empty: cls.includes('empty'), head: cls.includes('head'), i: tiles.length });
  };
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach((d, c) => add(d, 'head' + (HOT.has(c) ? ' hot' : ''), c, 0));
  const first = new Date(Y, M, 1).getDay(), total = new Date(Y, M + 1, 0).getDate();
  let thu = 0, fri = 0;
  for (let k = 0; k < first; k++) add('', 'empty', k, 1);
  for (let d = 1; d <= total; d++) {
    const col = (first + d - 1) % 7, row = Math.floor((first + d - 1) / 7) + 1;
    if (col === 4) thu++; if (col === 5) fri++;
    add(d, HOT.has(col) ? 'hot' : '', col, row);
  }
  document.getElementById('thuCount').textContent = thu;
  document.getElementById('friCount').textContent = fri;

  // ---------- timeline helpers ----------
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const easeBack = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const mix = (a, b, x) => a + (b - a) * x;
  const orange = 'linear-gradient(135deg, #ff6b35, #ff8c42)';

  const board = document.getElementById('board');
  const glow = document.getElementById('glow');
  const chipThu = document.getElementById('chipThu');
  const chipFri = document.getElementById('chipFri');

  window.DURATION = 10;

  window.renderFrame = (t) => {
    // camera: slow sway + slight push-in
    const sway = Math.sin(t / window.DURATION * Math.PI * 2 - Math.PI / 2);
    const intro = easeOut(prog(t, 0, 2.5));
    const rotX = mix(68, 55, intro) + sway * 2;
    const rotZ = baseRotZ + sway * 6 + mix(-14, 0, intro);
    const scale = mix(0.86, 1, intro) + prog(t, 2.5, window.DURATION) * 0.05;
    board.style.transform = `scale(${scale}) rotateX(${rotX}deg) rotateZ(${rotZ}deg)`;

    // title
    const ti = easeOut(prog(t, 0.1, 1.1));
    title.style.opacity = ti;
    title.style.transform = `translateY(${(1 - ti) * 4 * U}px)`;

    // slab appear
    const si = easeOut(prog(t, 0.2, 1.0));
    slab.style.opacity = si;

    // Thu/Fri rise phase
    const riseStart = 3.0;
    const glowAmt = easeOut(prog(t, riseStart, riseStart + 1.2));
    slab.style.boxShadow = `0 0 ${mix(40, 110, glowAmt)}px rgba(255,107,53,${mix(0.12, 0.3, glowAmt)})`;
    glow.style.opacity = mix(0.5, 1, glowAmt);

    for (const tl of tiles) {
      // drop in
      const start = 0.5 + tl.i * 0.032;
      const p = prog(t, start, start + 0.7);
      const baseLift = cell * 0.09;
      let lift = baseLift;

      // color fill + rise for Thu/Fri
      let heat = 0;
      if (tl.hot) {
        const hs = riseStart + tl.row * 0.09 + (tl.col - 4) * 0.12;
        heat = easeOut(prog(t, hs - 0.35, hs + 0.15));
        const r = easeBack(prog(t, hs, hs + 0.75));
        const target = cell * (tl.head ? 0.75 : 0.55);
        // gentle wave on top once risen
        const wave = Math.sin((t - hs) * 2.6 - tl.row * 0.6) * cell * 0.06 * prog(t, hs + 0.75, hs + 1.5);
        lift = mix(baseLift, target, r) + wave;
      }

      tl.el.style.setProperty('--lift', lift + 'px');
      tl.el.style.visibility = p > 0 ? 'visible' : 'hidden';
      const e = easeBack(p);
      tl.el.style.transform = `translateZ(${mix(cell * 4, lift, e)}px) rotateX(${mix(-90, 0, Math.min(1, e))}deg)`;

      if (tl.empty) continue;
      if (tl.hot) {
        tl.el.style.background = heat > 0
          ? `linear-gradient(135deg, rgba(255,107,53,${heat}), rgba(255,140,66,${heat})), ${tl.head ? '#333' : '#2a2a2a'}`
          : '';
        tl.el.style.color = heat > 0.5 ? '#fff' : '';
        const pulse = 0.5 + 0.5 * Math.sin((t - riseStart) * 2.6 - tl.row * 0.5 - tl.col);
        tl.el.style.boxShadow = heat > 0
          ? `0 0 ${mix(14, 40, pulse) * heat * cell / 70}px rgba(255,140,66,${mix(0.35, 0.85, pulse) * heat})`
          : 'none';
        // side faces turn orange with the top
        tl.el.classList.toggle('hot', heat > 0.3);
      }
    }

    // chips
    [chipThu, chipFri].forEach((c, k) => {
      const ci = easeBack(prog(t, 4.6 + k * 0.2, 5.3 + k * 0.2));
      c.style.opacity = clamp(ci);
      c.style.transform = `translateY(${(1 - ci) * 5 * U}px) scale(${mix(0.8, 1, clamp(ci))})`;
    });
  };

  // hot tiles start neutral; renderFrame decides when they turn orange
  tiles.forEach(tl => tl.hot && tl.el.classList.remove('hot'));
  window.renderFrame(0);
})();
</script>
</body>
</html>
